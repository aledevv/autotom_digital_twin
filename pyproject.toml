[project]
name = "autotom-digital-twin"
version = "0.1.0"
description = "OpenUSD and Isaac Sim digital twin pipeline for tomato plants generated from GroIMP growth data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gropy>=0.0.5",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.4.0",
    "pandas>=3.0.3",
    "pytest>=9.1.1",
    "pyvis>=0.3.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "types-usd>=24.5.2",
    "usd-core>=26.5",
]

[tool.uv]
package = true

[tool.uv.sources]
gropy = { index = "groimp" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "groimp"
url = "https://gitlab.com/api/v4/projects/50527255/packages/pypi/simple"

[dependency-groups]
dev = [
    "hatchling>=1.30.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/exporterV1", "src/exporterV2"]
