# CLI overrides only backend and seed. Resource paths are relative to the submodule resources.
backend: gaussian
seed: 42
timeout_seconds: 600
generator:
  model: gaussian_efd_d16
  bank: shape_bank.npz
  neighbours: 5
  dirichlet_alpha: 1.0
  maximum_raw_weight: 0.95
  maximum_expansion: 0.1
  variation_seed_offset: 90000
  maximum_weight_draws: 100
  maximum_geometry_attempts: 100
